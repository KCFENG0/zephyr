#
# Schema to validate a YAML file describing a Zephyr test suite
#
# We load this with jsonschema (https://json-schema.org/), a JSON/YAML
# structure validator, to validate the YAML files that describe Zephyr
# test suites
#
# The original spec comes from Zephyr's twister script
#
$defs:
  scenario-schema:
    type: object
    additionalProperties: false
    properties:
      arch_exclude: {}
      arch_allow: {}
      testcases:
        type:
        - array
        - 'null'
        items:
          type: string
      build_only:
        type:
        - boolean
        - 'null'
      build_on_all:
        type:
        - boolean
        - 'null'
      depends_on: {}
      extra_args: {}
      extra_configs:
        type:
        - array
        - 'null'
        items:
          type: string
      extra_conf_files:
        type:
        - array
        - 'null'
        items:
          type: string
      extra_overlay_confs:
        type:
        - array
        - 'null'
        items:
          type: string
      extra_dtc_overlay_files:
        type:
        - array
        - 'null'
        items:
          type: string
      extra_sections: {}
      required_snippets:
        type:
        - array
        - 'null'
        items:
          type: string
      filter:
        type:
        - string
        - 'null'
      levels:
        type:
        - array
        - 'null'
        items:
          type: string
          enum:
          - smoke
          - unit
          - integration
          - acceptance
          - system
          - regression
      integration_platforms:
        type:
        - array
        - 'null'
        items:
          type: string
      ignore_faults:
        type:
        - boolean
        - 'null'
      ignore_qemu_crash:
        type:
        - boolean
        - 'null'
      harness:
        type:
        - string
        - 'null'
      harness_config:
        type:
        - object
        - 'null'
        additionalProperties: false
        properties:
          type:
            type:
            - string
            - 'null'
          fixture:
            type:
            - string
            - 'null'
          ordered:
            type:
            - boolean
            - 'null'
          pytest_root:
            type:
            - array
            - 'null'
            items:
              type: string
          pytest_args:
            type:
            - array
            - 'null'
            items:
              type: string
          pytest_dut_scope:
            type:
            - string
            - 'null'
            enum:
            - function
            - class
            - module
            - package
            - session
          regex:
            type:
            - array
            - 'null'
            items:
              type: string
          robot_testsuite: {}
          robot_option: {}
          record:
            type:
            - object
            - 'null'
            additionalProperties: false
            required:
            - regex
            properties:
              regex:
                type: string
              as_json:
                type:
                - array
                - 'null'
                items:
                  type: string
          bsim_exe_name:
            type:
            - string
            - 'null'
      min_ram:
        type:
        - integer
        - 'null'
      min_flash:
        type:
        - integer
        - 'null'
      modules:
        type:
        - array
        - 'null'
        items:
          type: string
      platform_exclude: {}
      platform_allow: {}
      platform_type:
        type:
        - array
        - 'null'
        items:
          type: string
          enum:
          - mcu
          - qemu
          - sim
          - unit
          - native
      platform_key:
        type:
        - array
        - 'null'
        items:
          type: string
        uniqueItems: true
      simulation_exclude:
        type:
        - array
        - 'null'
        items:
          type: string
          enum:
          - qemu
          - simics
          - xt-sim
          - renode
          - nsim
          - mdb-nsim
          - tsim
          - armfvp
          - native
          - custom
      tags: {}
      timeout:
        type:
        - integer
        - 'null'
      toolchain_exclude: {}
      toolchain_allow: {}
      type:
        type:
        - string
        - 'null'
        enum:
        - unit
      skip:
        type:
        - boolean
        - 'null'
      slow:
        type:
        - boolean
        - 'null'
      sysbuild:
        type:
        - boolean
        - 'null'
type: object
additionalProperties: false
required:
- tests
properties:
  common:
    anyOf:
    - $ref: '#/$defs/scenario-schema'
    - type: 'null'
  sample:
    type:
    - object
    - 'null'
    additionalProperties: false
    required:
    - name
    properties:
      name:
        type: string
      description:
        type:
        - string
        - 'null'
  tests:
    type: object
    additionalProperties: false
    patternProperties:
      ([a-zA-Z0-9_]+):
        $ref: '#/$defs/scenario-schema'

#
# Schema to validate hardware map YAML files for twister
#
type: array
items:
  type: object
  additionalProperties: false
  required:
  - connected
  - id
  - platform
  - product
  - runner
  properties:
    available:
      type:
      - boolean
      - 'null'
    connected:
      type: boolean
    id:
      type: string
    notes:
      type:
      - string
      - 'null'
    platform:
      type: string
    probe_id:
      type:
      - string
      - 'null'
    product:
      type: string
    runner:
      type: string
    runner_params:
      type:
      - array
      - 'null'
      items:
        type: string
    serial_pty:
      type:
      - string
      - 'null'
    serial:
      type:
      - string
      - 'null'
    baud:
      type:
      - integer
      - 'null'
    post_script:
      type:
      - string
      - 'null'
    post_flash_script:
      type:
      - string
      - 'null'
    pre_script:
      type:
      - string
      - 'null'
    fixtures:
      type:
      - array
      - 'null'
      items:
        type: string
    flash_timeout:
      type:
      - integer
      - 'null'
    flash_with_test:
      type:
      - boolean
      - 'null'
    flash_before:
      type:
      - boolean
      - 'null'

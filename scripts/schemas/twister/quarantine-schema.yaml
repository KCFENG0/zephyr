#
# Schema to validate a YAML file providing the list of configurations
# under quarantine
#
# We load this with jsonschema (https://json-schema.org/), a JSON/YAML
# structure validator, to validate the YAML files that provide a list of
# configurations (scenarios + platforms) under quarantine
#
type: array
items:
  type: object
  additionalProperties: false
  properties:
    scenarios:
      type:
      - array
      - 'null'
      items:
        type: string
      uniqueItems: true
    platforms:
      type:
      - array
      - 'null'
      items:
        type: string
      uniqueItems: true
    architectures:
      type:
      - array
      - 'null'
      items:
        type: string
      uniqueItems: true
    simulations:
      type:
      - array
      - 'null'
      items:
        type: string
      uniqueItems: true
    comment:
      type:
      - string
      - 'null'

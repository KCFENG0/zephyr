#
# Schema to validate a YAML file describing a Zephyr test configuration.
#
type: object
additionalProperties: false
properties:
  platforms:
    type:
    - object
    - 'null'
    additionalProperties: false
    properties:
      override_default_platforms:
        type:
        - boolean
        - 'null'
      increased_platform_scope:
        type:
        - boolean
        - 'null'
      default_platforms:
        type:
        - array
        - 'null'
        items:
          type: string
  levels:
    type:
    - array
    - 'null'
    items:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        adds:
          type:
          - array
          - 'null'
          items:
            type: string
        inherits:
          type:
          - array
          - 'null'
          items:
            type: string

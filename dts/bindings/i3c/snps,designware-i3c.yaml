description: >
    This is a binding for the Synopsys I3C interface

compatible: "snps,designware-i3c"

include: [i3c-controller.yaml, pinctrl-device.yaml]

properties:
  clocks:
    required: true

  od-thigh-max-ns:
    type: int
    default: 41
    description: |
      Maximum high clock pulse length (ns) in Open-Drain mode.
      The default is value from Section 6.2 of the I3C
      Specifiction.

  od-tlow-min-ns:
    type: int
    default: 200
    description: |
      Minimum low clock pulse length (ns) in Open-Drain mode.
      The default is value from Section 6.2 of the I3C
      Specifiction.

  pp-thigh-max-ns:
    type: int
    default: 45
    description: |
      Maximum high clock pulse length (ns) in Push-Pull mode.
      The default is value from Section 6.2 of the I3C
      Specifiction.

  pp-tlow-min-ns:
    type: int
    description: |
      Minimum low clock pulse length (ns) in Push-Pull mode.

  sda-tx-hold-ns:
    type: int
    default: 10
    description: |
      The hold time of the SDA with respect to the SCL edge.
      The unit is in nanosecond.

  pec-en:
    type: boolean
    description: |
      Enable the use of Packet Error Code (PEC) in I3C transfers.
      If set to true, the driver will expect and handle PEC bytes
      in I3C messages.

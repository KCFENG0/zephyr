description: NPCM Crypto SHA accelerator.

compatible: "nuvoton,npcm-sha"

include: base.yaml

properties:
  reg:
    required: true

  in-swap:
    type: boolean
    description: SHA input data swap

  out-swap:
    type: boolean
    description: SHA output data swap

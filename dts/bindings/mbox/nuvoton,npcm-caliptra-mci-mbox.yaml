description: |
  Nuvoton NPCM M7-side view of a Caliptra MCU_MBOX instance.
  Each node exposes two mbox channels: channel 0 = requester, channel 1 = responder.

compatible: "nuvoton,npcm-caliptra-mci-mbox"

include: [base.yaml, mailbox-controller.yaml]

properties:
  reg:
    required: true
    description: Two tuples - SRAM aperture then CSR control page.

  reg-names:
    required: true
    description: Must be ["sram", "csr"].

  interrupts:
    required: false
    description: |
      soc_mcu_mbox*_data_avail (EXECUTE && MBOX_USER == MCU), level-high.
      Required when MBOX_NPCM_CALIPTRA_MCI_IRQ is selected.

  sram-size:
    type: int
    required: true
    description: Usable mailbox SRAM in bytes (aperture is 0x200000).

  poll-interval-ms:
    type: int
    default: 5
    description: |
      Poll-mode cadence in milliseconds. In IRQ mode, the cadence for
      watching requester completion and responder close, which raise no
      M7 interrupt.

  "#mbox-cells":
    const: 1

mbox-cells:
  - channel

description: Nuvoton, NPCM-SGPIO node

compatible: "nuvoton,npcm-sgpio"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  nuvoton,bus-freq:
    type: int
    default: 8000000
    description:
      SGPIO clock frequency.

  nuvoton,input-ngpios:
    type: int
    required: true

  nuvoton,output-ngpios:
    type: int
    required: true

child-binding:
  description: GPIO child node
  include: gpio-controller.yaml
  properties:
    ngpios:
      required: true

    pin-offset:
      type: int
      required: true
      description: Pin offset of this GPIO entry

    "#gpio-cells":
      const: 2

  gpio-cells:
  - pin
  - flags

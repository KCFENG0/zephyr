# FPGA M7 overlay for the standalone npcm_nor ztest.
# Mirrors the memory layout / clock / console settings from
# project/meta-nuvoton/npcm500-test/prj_fpga_m7_min.conf, minus the
# project-app-only Kconfig symbols (NPCM500_FPGA, FIU_MULTI_DEVICE,
# FIU_RD_REF_BOOT, NPCM500_FPGA_SRAM_TIMING_DIAG) which do not exist
# outside that app's own Kconfig.

CONFIG_KERNEL_BIN_NAME="NPCM5"

# Memory layout: 1MB physical SRAM at 0x0 carved into FLASH (lower 512KB
# at 0x0) and SRAM (upper 512KB at 0x80000). XIP=y so z_data_copy()
# restores .data on every M7 self-reset.
CONFIG_XIP=y
CONFIG_FLASH_BASE_ADDRESS=0x0
CONFIG_FLASH_SIZE=512
CONFIG_SRAM_BASE_ADDRESS=0x80000
CONFIG_SRAM_SIZE=512

# MCU ROM strips the M4-flash-boot header when loading M7.
CONFIG_ROM_START_OFFSET=0x0

# FPGA runs at 10MHz.
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=10000000

CONFIG_FPU=y

# Console (UART) — required to see anything at all.
CONFIG_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# MPU region table for the npcm5 SoC.
CONFIG_ARM_MPU=y
CONFIG_SOC_NPCM5_HYPERRAM_MPU_DEVICE=y

# I3C disabled: FPGA overlay wires i3c nodes, but this test app has no
# i3c source files, so leaving I3C=y breaks the link
# (undefined reference to __device_dts_ord_*).
CONFIG_I3C=n

name: Twister TestSuite

on:
  push:
    branches:
    - main
    - v*-branch
    - collab-*
    - ntil-npcm5-main_CI
    paths:
    - 'scripts/pylib/**'
    - 'scripts/twister'
    - 'scripts/tests/twister/**'
    - '.github/workflows/twister_tests.yml'
    - 'scripts/schemas/twister/'
  pull_request:
    branches:
    - main
    - v*-branch
    - ntil-npcm5-main_CI
    paths:
    - 'scripts/pylib/**'
    - 'scripts/twister'
    - 'scripts/tests/twister/**'
    - '.github/workflows/twister_tests.yml'
    - 'scripts/schemas/twister/'

jobs:
  # Use self-hosted runner for checkout to bypass IP allow list restrictions
  # GitHub hosted runners are blocked by repository IP allow list
  checkout:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: zephyr
      # Upload source code as artifact to transfer to GitHub hosted runners
      - name: Upload source code
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-source
          path: zephyr/
          retention-days: 1

  twister-tests:
    needs: checkout
    name: Twister Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-24.04]
    steps:
    - name: checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: scripts/requirements-actions.txt

    - name: Install Python packages
      run: |
        pip install -r scripts/requirements-actions.txt --require-hashes

    - name: Run pytest for twisterlib
      working-directory: zephyr
      env:
        ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      run: |
        export ZEPHYR_BASE=${PWD}
        echo "Run twister tests"
        PYTHONPATH=./scripts/tests pytest ./scripts/tests/twister
    - name: Run pytest for pytest-twister-harness
      working-directory: zephyr
      env:
        ZEPHYR_TOOLCHAIN_VARIANT: zephyr
        PYTHONPATH: ./scripts/pylib/pytest-twister-harness/src:${PYTHONPATH}
      run: |
        export ZEPHYR_BASE=${PWD}
        echo "Run twister tests"
        pytest ./scripts/pylib/pytest-twister-harness/tests
